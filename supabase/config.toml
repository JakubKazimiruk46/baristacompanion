# Konfiguracja Supabase CLI (lokalny podgląd: `npx supabase start`, wdrożenie: `npx supabase db push`
# i `npx supabase functions deploy`). Instrukcja krok po kroku: docs/backend.md.
project_id = "barista-companion"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# Adres aplikacji i dozwolone przekierowania po logowaniu (link z e-maila, Google).
# Na produkcji ustaw je w panelu: Authentication → URL Configuration (patrz docs/backend.md).
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/konto", "http://localhost:4173/konto"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
# Logowanie linkiem albo kodem z e-maila: bez hasła, więc bez potwierdzania adresu osobno.
enable_confirmations = false
otp_length = 6
otp_expiry = 3600

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false

# Funkcje same sprawdzają zalogowanego użytkownika (requestUser w _shared/http.ts) i bez niego zwracają 401.
# Sprawdzanie tokenu przez platformę (verify_jwt) jest wyłączone, bo przy nowych kluczach Supabase
# (sb_publishable_/sb_secret_) i nowych kluczach podpisu kończy się błędem „Invalid JWT”.
[functions.delete-account]
verify_jwt = false

[functions.scan-label]
verify_jwt = false

[functions.drink-assistant]
verify_jwt = false
